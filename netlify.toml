# Réglages Netlify : Netlify lit ce fichier automatiquement, rien à saisir à la main.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7.4 demande Node.js 22.23.4 ou plus récent
  NODE_VERSION = "22.23.4"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fichiers générés par Astro (noms avec empreinte) : cache long
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Pages regroupées : les anciennes adresses mènent à la section correspondante
[[redirects]]
  from = "/catering/prive-chef-aan-huis/"
  to = "/catering/#prive-chef-aan-huis"
  status = 301

